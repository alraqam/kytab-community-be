[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "rakhimberdiyeva",email = "malikarakh07@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.139.2,<0.140.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "celery[redis] (>=5.6.3,<6.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "fastapi-filter (>=3.0.0,<4.0.0)",
    "fastapi-utils (>=0.8.0,<0.9.0)",
    "typing-inspect (>=0.9.0,<0.10.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "protobuf (>=7.35.1,<8.0.0)",
    "google-api-core (>=2.33.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "greenlet (>=3.5.4,<4.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "flower (>=2.0.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
